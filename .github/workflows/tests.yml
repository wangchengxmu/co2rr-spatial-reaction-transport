name: Verify transport and isotope analyses
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python validate_release.py
      - run: python model/test_species_transfer.py
      - run: python -m unittest test_release_tools.py
      - run: python -m unittest isotope_analysis.test_analysis isotope_analysis.test_nmr
      - run: python -m isotope_analysis.acetate_carbonyl --out runs/acetate_carbonyl
      - run: python -m isotope_analysis.validate_analyses --acetate runs/acetate_carbonyl
      - run: python postprocess.py --out derived
